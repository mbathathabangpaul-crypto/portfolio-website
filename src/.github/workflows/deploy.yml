name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Upload Site

        uses: actions/upload-pages-artifact@v3

        with:
          path: .

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    permissions:
      pages: write

      id-token: write

    steps:
      - name: Deploy

        id: deployment

        uses: actions/deploy-pages@v4
